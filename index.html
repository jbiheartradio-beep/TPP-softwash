<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPP Soft Wash | Professional Pressure Washing Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #9dfc13;
            --dark-bg: #0b0b0b;
            --card-bg: #141414;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Decorative Slanted Bars */
        .accent-bars {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        .bar {
            width: 30px;
            height: 12px;
            background-color: var(--neon-green);
            transform: skewX(-25deg);
        }
        .bar.empty {
            background-color: transparent;
            border: 2px solid var(--neon-green);
        }

        /* Header / Hero Section */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(157, 252, 19, 0.1) 0%, rgba(11, 11, 11, 1) 100%);
        }

        .logo-placeholder {
            border: 4px solid var(--neon-green);
            padding: 20px 40px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: rgba(0,0,0,0.6);
            max-width: 100%;
        }

        .logo-placeholder h1 {
            color: var(--text-light);
            font-size: 2rem;
            letter-spacing: 2px;
        }
        .logo-placeholder p {
            color: var(--neon-green);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        .hero-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 1.1;
            margin-top: 10px;
        }

        .hero-title span {
            color: var(--neon-green);
            display: block;
            font-size: 3.5rem;
        }

        /* Main Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
                align-items: center;
            }
        }

        /* Left Side: CTAs */
        .cta-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 20px;
            border: 1px solid rgba(157, 252, 19, 0.2);
        }

        .btn-book {
            background-color: var(--neon-green);
            color: #000;
            font-size: 2rem;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 25px;
            display: inline-block;
        }

        .btn-book:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-green);
        }

        .phone-link {
            color: var(--text-light);
            font-size: 2.2rem;
            text-decoration: none;
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .phone-link:hover {
            color: var(--neon-green);
        }

        /* Social Icons */
        .socials {
            display: flex;
            gap: 20px;
        }

        .social-icon {
            width: 60px;
            height: 60px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #000;
            text-decoration: none;
            transition: transform 0.2s;
        }
        
        .social-icon.fb { background-color: #1877f2; color: white; }
        .social-icon.ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; }
        .social-icon.tt { background-color: #ffffff; color: black; }

        .social-icon:hover {
            transform: translateY(-5px);
        }

        /* Right Side: Services List */
        .services-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .service-item {
            background: #000;
            border: 3px solid #ff0000; /* Red capsule borders from flyer */
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Green half-circle indicator on the left of pills */
        .service-item::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 40px;
            background-color: var(--neon-green);
            border-radius: 0 40px 40px 0;
        }

        .service-item span {
            margin-left: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div class="accent-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar empty"></div>
            <div class="bar empty"></div>
        </div>

        <div class="logo-placeholder">
            <h1>TPP SOFT WASH</h1>
            <p>EST. 2024</p>
        </div>

        <h2 class="hero-title">
            Pressure Washing
            <span>Service</span>
        </h2>
    </header>

    <main class="container">
        
        <section class="cta-box">
            <a href="tel:7344690192" class="btn-book">Book Now</a>
            
            <a href="tel:7344690192" class="phone-link">734-469-0192</a>

            <div class="socials">
                <a href="#" class="social-icon fb" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon ig" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon tt" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            </div>
        </section>

        <section class="services-list">
            <div class="service-item"><span>Driveways & Sidewalks</span></div>
            <div class="service-item"><span>House Wash</span></div>
            <div class="service-item"><span>Roof Cleaning</span></div>
            <div class="service-item"><span>Decks & Fences</span></div>
            <div class="service-item"><span>Commercial & Residential</span></div>
        </section>

    </main>

    <footer>
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <div class="accent-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar empty"></div>
                <div class="bar empty"></div>
            </div>
        </div>
        <p>&copy; 2026 TPP Soft Wash. All Rights Reserved.</p>
    </footer>

</body>
</html>
