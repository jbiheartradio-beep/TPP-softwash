<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPP Soft Wash | Pressure & Soft Washing Service</title>
    <!-- Font Awesome for Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #9dfc13;
            --dark-bg: #0b0b0b;
            --card-bg: #141414;
            --text-light: #ffffff;
            --pill-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Diagonal Accent Graphic Components */
        .accent-bars {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }

        .bar {
            width: 30px;
            height: 12px;
            background-color: var(--neon-green);
            transform: skewX(-25deg);
        }
        .bar.empty {
            background-color: transparent;
            border: 2px solid var(--neon-green);
        }

        /* Header Layout */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 50px 20px 30px 20px;
            background: linear-gradient(180deg, rgba(157, 252, 19, 0.12) 0%, rgba(11, 11, 11, 1) 100%);
        }

        /* CSS Render of the Logo Shield from the flyers */
        .brand-logo-shield {
            border: 4px solid var(--neon-green);
            padding: 25px 35px;
            background: linear-gradient(135deg, #1a2a05 0%, #050a00 100%);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(157, 252, 19, 0.25);
            margin-bottom: 25px;
            text-align: center;
            max-width: 90%;
        }

        .brand-logo-shield .wings-icon {
            font-size: 2.5rem;
            color: var(--neon-green);
            margin-bottom: 5px;
            animation: pulse 3s infinite alternate;
        }

        .brand-logo-shield h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: var(--text-light);
            text-shadow: 2px 2px #000;
        }

        .brand-logo-shield p {
            color: var(--neon-green);
            font-size: 0.85rem;
            letter-spacing: 6px;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Typography & Headings */
        .hero-title {
            font-size: 2.4rem;
            text-transform: uppercase;
            line-height: 1.1;
            margin-top: 15px;
            letter-spacing: -1px;
        }

        .hero-title span {
            color: var(--neon-green);
            display: block;
            font-size: 3.6rem;
            letter-spacing: 1px;
        }

        .slogan {
            font-family: 'Arial', sans-serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.3rem;
            color: #e0e0e0;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .location-badge {
            background-color: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--pill-red);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .location-badge i {
            color: var(--neon-green);
        }

        /* Grid Framework */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1.1fr 0.9fr;
                align-items: start;
            }
        }

        /* Left Column: Core CTA Card */
        .cta-card {
            background: linear-gradient(145deg, #111111 0%, #1a1a1a 100%);
            padding: 45px 25px;
            border-radius: 24px;
            border: 1px solid rgba(157, 252, 19, 0.15);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-book {
            background-color: var(--neon-green);
            color: #000;
            font-size: 2.2rem;
            padding: 18px 50px;
            text-decoration: none;
            border-radius: 50px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(157, 252, 19, 0.2);
        }

        .btn-book:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--neon-green);
        }

        .phone-link {
            color: var(--text-light);
            font-size: 2.4rem;
            text-decoration: none;
            margin-bottom: 35px;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .phone-link:hover {
            color: var(--neon-green);
        }

        /* Social Networks Block */
        .socials-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            text-decoration: none;
            transition: transform 0.2s, filter 0.2s;
        }
        
        .social-btn.yt { background-color: #ff0000; }
        .social-btn.fb { background-color: #1877f2; }
        .social-btn.ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .social-btn.tt { background-color: #000000; border: 1px solid #fff; }
        .social-btn.gg { background-color: #ffffff; color: #4285F4; }

        .social-btn:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        /* Right Column: Interactive Menu Capsules */
        .services-wrapper {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .service-capsule {
            background: #000000;
            border: 3px solid var(--pill-red);
            border-radius: 50px;
            padding: 16px 35px;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Neon green semicircular accent tag on left edge of pills */
        .service-capsule::before {
            content: '';
            position: absolute;
            left: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 42px;
            background-color: var(--neon-green);
            border-radius: 0 40px 40px 0;
        }

        .service-capsule span {
            margin-left: 15px;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Footer Custom Style */
        footer {
            text-align: center;
            padding: 60px 20px 40px 20px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <!-- Top Accent Slanted Blocks -->
        <div class="accent-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar empty"></div>
            <div class="bar empty"></div>
        </div>

        <!-- Digital Styled Brand Shield -->
        <div class="brand-logo-shield">
            <div class="wings-icon"><i class="fas fa-feather-alt"></i></div>
            <h1>TPP SOFT WASH</h1>
            <p>EST. 2024</p>
        </div>

        <h2 class="hero-title">
            Pressure & Soft Washing
            <span>Service</span>
        </h2>
        
        <!-- Slogan Integration -->
        <p class="slogan">"Where Clean Meets Perfection"</p>
        
        <!-- Regional Service Area Badge -->
        <div class="location-badge">
            <i class="fas fa-crosshairs"></i> Servicing Washtenaw County
        </div>
    </header>

    <main class="container">
        
        <!-- Left Side Layout Card -->
        <section class="cta-card">
            <a href="tel:7344690192" class="btn-book">Book Now</a>
            
            <a href="tel:7344690192" class="phone-link">
                <i class="fas fa-phone-alt" style="color: var(--neon-green); font-size: 1.8rem;"></i> 734-469-0192
            </a>

            <!-- High Contrast Platform Icons (Now featuring your active Facebook link) -->
            <div class="socials-grid">
                <a href="#" class="social-btn yt" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="https://www.facebook.com/profile.php?id=61578867350139" target="_blank" class="social-btn fb" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-btn ig" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-btn tt" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="#" class="social-btn gg" aria-label="Google"><i class="fab fa-google"></i></a>
            </div>
        </section>

        <!-- Right Side Menu Array -->
        <section class="services-wrapper">
            <div class="service-capsule"><span>House Washing</span></div>
            <div class="service-capsule"><span>Driveways & Sidewalks</span></div>
            <div class="service-capsule"><span>Roofs & Roof Cleaning</span></div>
            <div class="service-capsule"><span>Decks & Fences</span></div>
            <div class="service-capsule"><span>Commercial & Residential</span></div>
        </section>

    </main>

    <footer>
        <div style="display: flex; justify-content: center; margin-bottom: 25px;">
            <div class="accent-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar empty"></div>
                <div class="bar empty"></div>
            </div>
        </div>
        <p>&copy; 2026 TPP Soft Wash. All Rights Reserved.</p>
    </footer>

</body>
</html>
